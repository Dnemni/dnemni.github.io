<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dhruv Nemani</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
<header class="site-header">
    <p class="site-brand">Dhruv's Workshop</p>
    <p class="site-status">System status: early development</p>
</header>

<main class="portfolio">

    <section class="identity-panel">
        <div class="identity-heading">
            <h1>Dhruv Nemani</h1>
            <p class="identity-role">Software Engineer · AI · Systems</p>
        </div>

        <!-- Turning core into an interactive button element -->
        <button
            class="workshop-core"
            type="button"
            aria-label="Generate curiosity"
        >
            <span>Core</span>
        </button>

        <!-- Use id instead of class to answer which unique element this is -->
        <p class="curiosity-readout">
            <span id="curiosity-count">0</span>
            curiosity
        </p>

        <button
            class="reset-progress"
            type="button"
            data-reset-progress
        >
            Reset workshop
        </button>

        <div class="current-status">
            <span class="status-indicator" aria-hidden="true"></span>

            <div>
                <p class="status-label">Currently:</p>
                <p>Purdue CS + AI</p>
            </div>
        </div>
    </section>

    <section class="world-panel">
        <div class="panel-heading">
            <p class="panel-kicker">Environment</p>
            <h2>The Workshop</h2>
        </div>

        <div class="world-canvas">

            <!-- Workshop Stations start as offline and become online when explored -->
            <div
                class="workshop-stations"
                aria-label="Workshop systems"
            >
                <button
                    class="workshop-station"
                    type="button"
                    data-station="about"
                >
                    <span class="station-code">SYS-01</span>

                    <span class="station-name">
                        Profile Archive
                    </span>

                    <span
                        class="station-status"
                        data-station-status
                    >
                        Offline
                    </span>
                </button>

                <button
                    class="workshop-station"
                    type="button"
                    data-station="experience"
                >
                    <span class="station-code">SYS-02</span>

                    <span class="station-name">
                        Field Log
                    </span>

                    <span
                        class="station-status"
                        data-station-status
                    >
                        Offline
                    </span>
                </button>

                <button
                    class="workshop-station"
                    type="button"
                    data-station="projects"
                >
                    <span class="station-code">SYS-03</span>

                    <span class="station-name">
                        Project Bay
                    </span>

                    <span
                        class="station-status"
                        data-station-status
                    >
                        Offline
                    </span>
                </button>

                <button
                    class="workshop-station"
                    type="button"
                    data-station="side-quests"
                >
                    <span class="station-code">SYS-04</span>

                    <span class="station-name">
                        Recreation Deck
                    </span>

                    <span
                        class="station-status"
                        data-station-status
                    >
                        Offline
                    </span>
                </button>

                <button
                    class="workshop-station"
                    type="button"
                    data-station="resume"
                >
                    <span class="station-code">SYS-05</span>

                    <span class="station-name">
                        Personnel File
                    </span>

                    <span
                        class="station-status"
                        data-station-status
                    >
                        Offline
                    </span>
                </button>

                <button
                    class="workshop-station"
                    type="button"
                    data-station="contact"
                >
                    <span class="station-code">SYS-06</span>

                    <span class="station-name">
                        Comms Array
                    </span>

                    <span
                        class="station-status"
                        data-station-status
                    >
                        Offline
                    </span>
                </button>
            </div>

            <!-- Empty state begins as the active view within the world canvas -->
            <div
                class="world-empty-state"
                data-world-empty
            >
                <p class="empty-state-title">
                    Workshop standing by
                </p>

                <p>
                    Select a system to inspect.
                </p>
            </div>

            <!-- Article with hidden attribute means world detail begins as not relevant/visible -->
            <article
                class="world-detail"
                data-world-detail
                hidden
            >
                <p
                    class="panel-kicker"
                    data-detail-kicker
                ></p>

                <h3 data-detail-title></h3>

                <p
                    class="world-detail-copy"
                    data-detail-intro
                ></p>

                <div
                    class="detail-items"
                    data-detail-items
                ></div>

                <div
                    class="detail-actions"
                    data-detail-actions
                ></div>
            </article>

        </div>
    </section>

    <nav class="explore-panel" aria-label="Portfolio sections">
        <div class="panel-heading">
            <p class="panel-kicker">Navigation</p>
            <h2>Explore</h2>
        </div>

        <!-- Data section is metadata that javascript can ask for through button.dataset.section -->
        <button
            class="explore-link"
            type="button"
            data-section="about" 
        >
            <span class="explore-number">01</span>
            <span>About</span>
        </button>

        <button
            class="explore-link"
            type="button"
            data-section="experience"
        >
            <span class="explore-number">02</span>
            <span>Experience</span>
        </button>

        <button
            class="explore-link"
            type="button"
            data-section="projects"
        >
            <span class="explore-number">03</span>
            <span>Projects</span>
        </button>

        <button
            class="explore-link"
            type="button"
            data-section="side-quests"
        >
            <span class="explore-number">04</span>
            <span>Side Quests</span>
        </button>

        <button
            class="explore-link"
            type="button"
            data-section="resume"
        >
            <span class="explore-number">05</span>
            <span>Resume</span>
        </button>

        <button
            class="explore-link"
            type="button"
            data-section="contact"
        >
            <span class="explore-number">06</span>
            <span>Contact</span>
        </button>
    </nav>

</main>

</body>

</html>
